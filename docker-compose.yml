services:
  digicash:
    image: svi-digicash
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    container_name: svi-digicash
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DIGICASH_SERVICE_ID=${DIGICASH_SERVICE_ID}
      - DIGICASH_PASSWORK=${DIGICASH_PASSWORK}
      - DIGICASH_SECRET_KEY=${DIGICASH_SECRET_KEY}
      - DIGICASH_BASE_URL=${DIGICASH_BASE_URL:-https://api.fastpayph.com}
      - CALLBACK_URL=${CALLBACK_URL}
      - RETURN_URL=${RETURN_URL}
      - PORT=3000
    env_file:
      - config.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => {process.exit(res.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: svi-digicash-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - digicash
    restart: unless-stopped
    profiles:
      - production